# 友链数据。每条记录会渲染成 /friends/ 页一张卡片。
#
# 字段说明：
#   name        友站名，必填
#   url         友站完整链接，必填
#   avatar      头像图片 URL，可选；留空则回退到首字母方块占位
#   description 一句话描述，必填；卡片里的简介
#   weight      排序权重，可选；越小越靠前，未填则默认 0
#
# 用 weight 来控制顺序比"按字母"或"按添加时间"都更稳定——
# 你随时可以把感兴趣的友站提到前面，不影响其它记录的位置。
- name: heysifei
  url: https://www.heysifei.com
  avatar: https://www.heysifei.com/logo
  description: 这是一个非常牛逼的博客
  weight: 1

- name: 牛伟豪的博客（占位）
  url: https://blog.niuwh.cn
